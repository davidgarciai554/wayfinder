<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Wayfinder</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="web.skip">Saltar al contenido</a>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2.2 5-4.8 2 2.2-5z"></path></svg>
      Wayfinder
    </a>
    <label class="project-picker" id="project-picker" hidden>
      <span data-i18n="web.project">Proyecto</span>
      <select id="project-select"></select>
    </label>
    <nav class="tabs" id="tabs" aria-label="Vistas" hidden></nav>
    <div class="live" role="status" aria-live="polite">
      <span class="live-dot" id="live-dot" aria-hidden="true"></span>
      <span id="live-text"></span>
    </div>
  </header>
  <div id="banner" class="banner" role="alert" hidden>
    <span data-i18n="web.disconnected">Sin conexión con Wayfinder; los datos pueden estar desactualizados.</span>
    <button type="button" class="button" id="banner-retry" data-i18n="web.retry">Reintentar</button>
  </div>
  <div id="flash" class="flash" role="status" aria-live="polite"></div>
  <main id="main" tabindex="-1">
    <p class="status-text" role="status" data-i18n="web.loading">Cargando…</p>
  </main>
  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <h2 id="viewer-title"></h2>
      <button type="button" class="button icon-button" id="viewer-close" aria-label="Cerrar">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <img id="viewer-img" alt="">
  </dialog>
  <dialog class="task-modal" id="task-dialog" aria-labelledby="task-title"></dialog>
  <dialog class="modal" id="create-dialog" aria-labelledby="create-title">
    <form id="create-form" novalidate>
      <h2 id="create-title" data-i18n="web.newTask">Nueva tarea</h2>
      <p class="muted" data-i18n="web.form.note">Se crea en «Por hacer».</p>
      <div id="create-errors" class="notice" role="alert" tabindex="-1" hidden></div>
      <div class="field">
        <label for="create-name" data-i18n="web.form.title">Título</label>
        <p class="hint" id="create-name-hint" data-i18n="web.form.titleHint"></p>
        <input id="create-name" name="title" type="text" maxlength="200" autocomplete="off" aria-describedby="create-name-hint create-name-error" required>
        <p class="field-error" id="create-name-error" hidden></p>
      </div>
      <div class="field">
        <label for="create-body" data-i18n="web.form.body">Descripción</label>
        <p class="hint" id="create-body-hint" data-i18n="web.form.bodyHint"></p>
        <textarea id="create-body" name="body" rows="6" aria-describedby="create-body-hint create-body-error"></textarea>
        <p class="field-error" id="create-body-error" hidden></p>
      </div>
      <div class="field">
        <label for="create-priority" data-i18n="web.form.priority">Prioridad</label>
        <select id="create-priority" name="priority" aria-describedby="create-priority-error">
          <option value="low" data-i18n="web.priority.low">Baja</option>
          <option value="medium" data-i18n="web.priority.medium" selected>Media</option>
          <option value="high" data-i18n="web.priority.high">Alta</option>
        </select>
        <p class="field-error" id="create-priority-error" hidden></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="button" id="create-cancel" data-i18n="web.cancel">Cancelar</button>
        <button type="submit" class="button button-primary" id="create-submit" data-i18n="web.form.create">Crear tarea</button>
      </div>
    </form>
  </dialog>
  <dialog class="modal" id="discard-dialog" role="alertdialog" aria-labelledby="discard-title" aria-describedby="discard-text">
    <h2 id="discard-title"></h2>
    <p id="discard-text"></p>
    <p id="discard-error" class="notice" role="alert" hidden></p>
    <div class="modal-actions">
      <button type="button" class="button" id="discard-cancel" data-i18n="web.cancel" autofocus>Cancelar</button>
      <button type="button" class="button button-danger" id="discard-confirm" data-i18n="web.discard">Descartar</button>
    </div>
  </dialog>
</body>
</html>
