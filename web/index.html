<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Wayfinder</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="web.skip">Saltar al contenido</a>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2.2 5-4.8 2 2.2-5z"></path></svg>
      Wayfinder
    </a>
    <label class="project-picker" id="project-picker" hidden>
      <span data-i18n="web.project">Proyecto</span>
      <select id="project-select"></select>
    </label>
    <nav class="tabs" id="tabs" aria-label="Vistas" hidden></nav>
    <div class="live" role="status" aria-live="polite">
      <span class="live-dot" id="live-dot" aria-hidden="true"></span>
      <span id="live-text"></span>
    </div>
  </header>
  <div id="banner" class="banner" role="alert" hidden>
    <span data-i18n="web.disconnected">Sin conexión con Wayfinder; los datos pueden estar desactualizados.</span>
    <button type="button" class="button" id="banner-retry" data-i18n="web.retry">Reintentar</button>
  </div>
  <main id="main" tabindex="-1">
    <p class="status-text" role="status" data-i18n="web.loading">Cargando…</p>
  </main>
  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <h2 id="viewer-title"></h2>
      <button type="button" class="button icon-button" id="viewer-close" aria-label="Cerrar">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <img id="viewer-img" alt="">
  </dialog>
</body>
</html>
