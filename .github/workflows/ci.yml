name: CI

on:
  push:
    branches: [main, feat/wayfinder-mvp]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows · Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # npm ci (prepare) and npm test (pretest) rebuild plugin/dist/, so check the committed bundle before anything else.
      - name: Committed plugin bundle matches the build
        shell: bash
        run: |
          changes="$(git status --porcelain --untracked-files=all -- plugin/dist)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff --stat -- plugin/dist
            echo "::error::plugin/dist/ differs from a fresh build. Run \"npm run build\" and commit plugin/dist/."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:dist
      - run: npx playwright install chromium
      - run: npm run test:e2e
